<!DOCTYPE html>
<html>
<head>
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Expense Tracker</h1>
        <p class="subtitle">Manage your daily expenses easily</p>

        <!-- Add Expense Section -->
        <div class="form-box">

            <label>Expense Name</label>
            <input type="text" id="expenseName" placeholder="Enter expense name">

            <label>Amount</label>
            <input type="number" id="expenseAmount" placeholder="Enter amount">

            <label>Category</label>
            <select id="expenseCategory">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <button onclick="addExpense()">Add Expense</button>

        </div>

        <!-- Filter -->
        <div class="filter-box">

            <label>Filter by Category:</label>

            <select id="categoryFilter" onchange="displayExpenses()">
                <option value="All">All</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

        </div>

        <!-- Total -->
        <div class="total-box">
            <h2>Total Expense: ₹<span id="totalExpense">0</span></h2>
        </div>

        <!-- Expense List -->
        <div id="expenseList"></div>

    </div>

    <script src="variable.js"></script>

</body>
</html>
